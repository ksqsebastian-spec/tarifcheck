<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarifcheck</title>
<meta name="description" content="Die Tarifverträge der Gruppenwerk-Gewerke, automatisch geprüft und sicher archiviert.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
</head>
<body>

<header>
  <div class="wrap">
    <div class="kopfzeile">
      <span class="wortmarke">
        <img src="/logo.svg" class="brand-symbol" width="36" height="36" alt="">
        Tarifcheck
      </span>
      <span class="fuellung"></span>
      <span id="wer" class="meta" style="font-size:.85rem" hidden></span>
      <button id="pruefen" class="knopf-rand" hidden>Jetzt prüfen</button>
      <button id="anmelden" class="knopf-rand" hidden>Anmelden</button>
      <button id="abmelden" class="knopf-rand" hidden>Abmelden</button>
    </div>
    <nav role="tablist">
      <button role="tab" data-ansicht="uebersicht" aria-selected="true">Übersicht</button>
      <button role="tab" data-ansicht="meldungen" aria-selected="false">
        Benachrichtigungen <span id="zaehler" class="plakette" hidden></span>
      </button>
      <button role="tab" data-ansicht="dokumente" aria-selected="false">Dokumente</button>
      <button role="tab" data-ansicht="quellen" aria-selected="false">Quellen</button>
      <button role="tab" data-ansicht="hochladen" aria-selected="false">Hochladen</button>
    </nav>
  </div>
</header>

<main id="main">
  <div class="wrap">
    <div id="leiste" role="status" aria-live="polite" hidden></div>
    <div id="inhalt" aria-live="polite"></div>
  </div>
</main>

<footer><div class="wrap">Gruppenwerk · Tarifcheck <span style="float:right">Quellen prüfen. Fassungen bewahren.</span></div></footer>
<script src="/app.js"></script>
</body>
</html>
