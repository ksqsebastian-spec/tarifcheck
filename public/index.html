<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarifcheck</title>
<meta name="description" content="Die Tarifverträge der Gruppenwerk-Gewerke, täglich abgeglichen.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20aria-hidden%3D%22true%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230E7A55%22%2F%3E%3Cg%20transform%3D%22translate%2812.15%2012.15%29%20scale%28.62%29%22%3E%3Crect%20x%3D%229%22%20y%3D%229%22%20width%3D%2232%22%20height%3D%2240%22%20rx%3D%225%22%20fill%3D%22%23fff%22%20opacity%3D%22.62%22%2F%3E%3Crect%20x%3D%2219%22%20y%3D%2215%22%20width%3D%2232%22%20height%3D%2240%22%20rx%3D%225%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20fill%3D%22none%22%20stroke%3D%22%230E7A55%22%20stroke-width%3D%226.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%20d%3D%22M26%2035.5l6%206%2012-12.5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
</head>
<body>

<header>
  <div class="wrap">
    <div class="kopfzeile">
      <span class="wortmarke">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#0E7A55"/><g transform="translate(12.15 12.15) scale(.62)"><rect x="9" y="9" width="32" height="40" rx="5" fill="#fff" opacity=".62"/><rect x="19" y="15" width="32" height="40" rx="5" fill="#fff"/><path fill="none" stroke="#0E7A55" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" d="M26 35.5l6 6 12-12.5"/></g></svg>
        Tarifcheck
      </span>
      <span class="fuellung"></span>
      <span id="wer" class="meta" style="font-size:.85rem" hidden></span>
      <button id="pruefen" class="knopf-rand" hidden>Jetzt prüfen</button>
      <button id="anmelden" class="knopf-rand" hidden>Anmelden</button>
      <button id="abmelden" class="knopf-rand" hidden>Abmelden</button>
    </div>
    <nav role="tablist">
      <button role="tab" data-ansicht="uebersicht" aria-selected="true">Übersicht</button>
      <button role="tab" data-ansicht="meldungen" aria-selected="false">
        Benachrichtigungen <span id="zaehler" class="plakette" hidden></span>
      </button>
      <button role="tab" data-ansicht="dokumente" aria-selected="false">Dokumente</button>
      <button role="tab" data-ansicht="quellen" aria-selected="false">Quellen</button>
      <button role="tab" data-ansicht="hochladen" aria-selected="false">Hochladen</button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="leiste" hidden></div>
    <div id="inhalt"></div>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
