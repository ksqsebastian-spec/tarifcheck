<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarifcheck</title>
<meta name="description" content="Die Tarifverträge der Gruppenwerk-Gewerke, täglich abgeglichen.">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231F7A5C'/%3E%3Cg fill='%23fff'%3E%3Crect x='14' y='19' width='36' height='6' rx='3'/%3E%3Crect x='14' y='30' width='36' height='6' rx='3'/%3E%3Crect x='14' y='41' width='21' height='6' rx='3'/%3E%3C/g%3E%3C/svg%3E">
</head>
<body>

<header>
  <div class="wrap">
    <div class="kopfzeile">
      <span class="wortmarke">
        <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="16" fill="#1F7A5C"/>
          <g fill="#fff">
            <rect x="14" y="19" width="36" height="6" rx="3"/>
            <rect x="14" y="30" width="36" height="6" rx="3"/>
            <rect x="14" y="41" width="21" height="6" rx="3"/>
          </g>
        </svg>
        Tarifcheck
      </span>
      <span class="fuellung"></span>
      <button id="pruefen" class="knopf-rand">Jetzt prüfen</button>
    </div>
    <nav role="tablist">
      <button role="tab" data-ansicht="uebersicht" aria-selected="true">Übersicht</button>
      <button role="tab" data-ansicht="meldungen" aria-selected="false">
        Benachrichtigungen <span id="zaehler" class="plakette" hidden></span>
      </button>
      <button role="tab" data-ansicht="dokumente" aria-selected="false">Dokumente</button>
      <button role="tab" data-ansicht="quellen" aria-selected="false">Quellen</button>
      <button role="tab" data-ansicht="hochladen" aria-selected="false">Hochladen</button>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div id="leiste" hidden></div>
    <div id="inhalt"></div>
  </div>
</main>

<script src="/app.js"></script>
</body>
</html>
