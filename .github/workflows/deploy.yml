# Veroeffentlichen, ohne jedes Mal ein Token von Hand zu erzeugen.
#
# Anlass: das Token-Besorgen hat dreimal hintereinander die Arbeit aufgehalten,
# weil die kurzlebigen Token zwischen zwei Sitzungen ablaufen. Hier liegt es
# einmal als Repository-Secret, und niemand muss es je wieder durchreichen.
#
# Einrichtung siehe SETUP.md, Abschnitt "Veroeffentlichen".

name: Deploy

on:
  push:
    branches: [claude/cloudflare-tarifvertrag-dashboard-bdyi0l]
    # Aenderungen, die den Worker nicht betreffen, muessen ihn auch nicht neu
    # ausrollen. Eine Zeile in der README ist kein Grund fuer eine neue Fassung.
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  workflow_dispatch:

# Zwei Laeufe gleichzeitig wuerden sich gegenseitig ueberholen: der langsamere
# ueberschriebe am Ende den neueren Stand.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Erst pruefen, dann ausrollen. Ein Tippfehler im TypeScript soll hier
      # auffallen und nicht auf der Seite - der Worker laeuft sonst weiter mit
      # der letzten heilen Fassung, was gut ist, aber niemand merkt es.
      - name: Typen pruefen
        run: npm run typecheck

      - name: Datenbank-Migrationen anwenden
        run: npx wrangler d1 migrations apply tarifcheck --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Veroeffentlichen
        id: veroeffentlichen
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          fassung=$(grep -oE 'Current Version ID: [0-9a-f-]+' deploy.log | tail -1 | awk '{print $NF}')
          echo "fassung=$fassung" >> "$GITHUB_OUTPUT"
          echo "Ausgerollte Fassung: ${fassung:-unbekannt}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Der Deploy meldet Erfolg, sobald die Datei oben ist. Ob der Worker
      # danach auch antwortet, ist eine andere Frage.
      #
      # Und es genuegt nicht, dass IRGENDJEMAND antwortet: nach dem Deploy
      # liefert ein bis zwei Minuten lang noch die vorige Fassung. Der Check
      # hier war deshalb frueher nach einer Sekunde gruen und hat in Wahrheit
      # den Vorgaenger geprueft - er konnte einen kaputten Deploy gar nicht
      # bemerken. Jetzt wird gewartet, bis die Fassungskennung aus dem Deploy
      # auch wirklich aus /api/gesundheit zurueckkommt.
      - name: Nachsehen, ob die neue Fassung antwortet
        run: |
          erwartet="${{ steps.veroeffentlichen.outputs.fassung }}"
          if [ -z "$erwartet" ]; then
            echo "Keine Fassungskennung aus dem Deploy gelesen — es wird nur auf Antwort geprüft."
          fi
          for i in $(seq 1 20); do
            antwort=$(curl -sf https://tarifcheck.ksqsebastian.workers.dev/api/gesundheit) || {
              echo "Versuch $i: keine Antwort"; sleep 6; continue; }
            if ! echo "$antwort" | grep -q '"selbstbindung":"ok"'; then
              echo "Versuch $i: Selbstbindung noch nicht ok"; sleep 6; continue
            fi
            if [ -z "$erwartet" ] || echo "$antwort" | grep -q "\"fassung\":\"$erwartet\""; then
              echo "$antwort"; exit 0
            fi
            echo "Versuch $i: noch die vorige Fassung"
            sleep 6
          done
          echo "Die neue Fassung antwortet nicht innerhalb von zwei Minuten."
          exit 1
